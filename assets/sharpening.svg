<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="'JetBrains Mono','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B2FF7"/>
      <stop offset="0.6" stop-color="#F15BB5"/>
      <stop offset="1" stop-color="#00F5D4"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B2FF7"/>
      <stop offset="1" stop-color="#00F5D4"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="718" height="298" rx="16" fill="#0D1117" stroke="url(#border)" stroke-width="2"/>

  <!-- Row template: label, track, animated fill, percentage -->
  <g font-size="14" fill="#C9D1D9">
    <text x="32" y="52">WEB PENTESTING</text>
    <rect x="230" y="38" width="400" height="14" rx="7" fill="#161B22"/>
    <rect x="230" y="38" width="0" height="14" rx="7" fill="url(#bar)">
      <animate attributeName="width" from="0" to="267" dur="1.4s" begin="0.2s" fill="freeze"/>
    </rect>
    <text x="645" y="51" fill="#00F5D4" opacity="0">67%<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze"/></text>

    <text x="32" y="96">NETWORK PENTESTING</text>
    <rect x="230" y="82" width="400" height="14" rx="7" fill="#161B22"/>
    <rect x="230" y="82" width="0" height="14" rx="7" fill="url(#bar)">
      <animate attributeName="width" from="0" to="178" dur="1.4s" begin="0.4s" fill="freeze"/>
    </rect>
    <text x="645" y="95" fill="#00F5D4" opacity="0">45%<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/></text>

    <text x="32" y="140">ACTIVE DIRECTORY</text>
    <rect x="230" y="126" width="400" height="14" rx="7" fill="#161B22"/>
    <rect x="230" y="126" width="0" height="14" rx="7" fill="url(#bar)">
      <animate attributeName="width" from="0" to="178" dur="1.4s" begin="0.6s" fill="freeze"/>
    </rect>
    <text x="645" y="139" fill="#00F5D4" opacity="0">45%<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze"/></text>

    <text x="32" y="184">RED TEAMING</text>
    <rect x="230" y="170" width="400" height="14" rx="7" fill="#161B22"/>
    <rect x="230" y="170" width="0" height="14" rx="7" fill="url(#bar)">
      <animate attributeName="width" from="0" to="222" dur="1.4s" begin="0.8s" fill="freeze"/>
    </rect>
    <text x="645" y="183" fill="#00F5D4" opacity="0">55%<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2s" fill="freeze"/></text>

    <text x="32" y="228">CTFs</text>
    <rect x="230" y="214" width="400" height="14" rx="7" fill="#161B22"/>
    <rect x="230" y="214" width="0" height="14" rx="7" fill="url(#bar)">
      <animate attributeName="width" from="0" to="289" dur="1.4s" begin="1s" fill="freeze"/>
    </rect>
    <text x="645" y="227" fill="#00F5D4" opacity="0">72%<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.2s" fill="freeze"/></text>

    <text x="32" y="272">SECURITY TOOLING</text>
    <rect x="230" y="258" width="400" height="14" rx="7" fill="#161B22"/>
    <rect x="230" y="258" width="0" height="14" rx="7" fill="url(#bar)">
      <animate attributeName="width" from="0" to="222" dur="1.4s" begin="1.2s" fill="freeze"/>
    </rect>
    <text x="645" y="271" fill="#00F5D4" opacity="0">55%<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.4s" fill="freeze"/></text>
  </g>
</svg>
