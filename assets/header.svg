<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.6" stop-color="#150a28"/>
      <stop offset="1" stop-color="#1f0a2e"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5D4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00F5D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5D4"/>
      <stop offset="0.5" stop-color="#7B2FF7"/>
      <stop offset="1" stop-color="#F15BB5"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00F5D4" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="900" height="280" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="280" fill="url(#bg)"/>

    <g>
      <rect x="-30" y="-30" width="960" height="340" fill="url(#grid)"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;30,30" dur="3s" repeatCount="indefinite"/>
    </g>

    <circle cx="140" cy="60" r="110" fill="#7B2FF7" opacity="0.14">
      <animate attributeName="cx" values="140;200;140" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.10;0.20;0.10" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="220" r="120" fill="#F15BB5" opacity="0.12">
      <animate attributeName="cx" values="780;720;780" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.18;0.08" dur="7s" repeatCount="indefinite"/>
    </circle>

    <g fill="#00F5D4">
      <circle cx="80"  cy="280" r="2"><animate attributeName="cy" values="290;-10" dur="6s"   repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="6s"   repeatCount="indefinite"/></circle>
      <circle cx="190" cy="280" r="1.5"><animate attributeName="cy" values="290;-10" dur="8s"   begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8s"   begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="280" r="2"><animate attributeName="cy" values="290;-10" dur="7s"   begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="7s"   begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="280" r="1.5"><animate attributeName="cy" values="290;-10" dur="9s"   begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s"   begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="280" r="2"><animate attributeName="cy" values="290;-10" dur="6.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="6.5s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="730" cy="280" r="1.5"><animate attributeName="cy" values="290;-10" dur="8.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8.5s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="280" r="2"><animate attributeName="cy" values="290;-10" dur="7.5s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="7.5s" begin="2.5s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="0" y="-80" width="900" height="80" fill="url(#scan)">
      <animate attributeName="y" values="-80;280" dur="4s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="0" width="900" height="34" fill="#000" opacity="0.35"/>
    <circle cx="24" cy="17" r="5" fill="#F15BB5"/>
    <circle cx="44" cy="17" r="5" fill="#FFC857"/>
    <circle cx="64" cy="17" r="5" fill="#00F5D4"/>
    <text x="450" y="22" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#8B949E">root@kr4k3n: ~/offensive-security</text>

    <g font-family="'JetBrains Mono','Courier New',monospace" font-size="92" font-weight="800" text-anchor="middle">
      <text x="450" y="148" fill="#F15BB5" opacity="0.75">KR4K3N
        <animate attributeName="x" values="450;450;444;457;450;450;452;447;450" keyTimes="0;0.82;0.84;0.86;0.88;0.93;0.95;0.97;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="148" fill="#7B2FF7" opacity="0.75">KR4K3N
        <animate attributeName="x" values="450;450;456;443;450;450;448;453;450" keyTimes="0;0.82;0.84;0.86;0.88;0.93;0.95;0.97;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="148" fill="#00F5D4" filter="url(#glow)">KR4K3N
        <animate attributeName="opacity" values="1;1;0.85;1;1;0.9;1" keyTimes="0;0.8;0.84;0.88;0.93;0.96;1" dur="4s" repeatCount="indefinite"/>
      </text>
    </g>

    <g font-family="'JetBrains Mono','Courier New',monospace" font-size="20" fill="#C9D1D9" text-anchor="middle">
      <text x="450" y="200" opacity="0">&gt; Offensive Security | Red Teaming
        <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.30;0.33;0.66;0.99;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="200" opacity="0">&gt; Web &amp; Network Pentesting
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.63;0.66;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="200" opacity="0">&gt; CTFs | Active Directory | Research
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.69;0.96;1" dur="9s" repeatCount="indefinite"/>
      </text>
    </g>

    <text x="450" y="238" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="14" letter-spacing="6" fill="#00F5D4" opacity="0.85">ANANT AWASTHI</text>
    <circle cx="866" cy="262" r="4" fill="#00F5D4"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="856" y="266" text-anchor="end" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" fill="#8B949E">SYSTEM ONLINE</text>
    <text x="24" y="266" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" fill="#8B949E">learn → break → understand → build</text>
  </g>

  <rect x="1.5" y="1.5" width="897" height="277" rx="15" fill="none" stroke="url(#border)" stroke-width="2" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
