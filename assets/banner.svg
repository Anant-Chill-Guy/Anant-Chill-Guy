<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="'JetBrains Mono','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0a1f24"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B2FF7"/>
      <stop offset="0.5" stop-color="#F15BB5"/>
      <stop offset="1" stop-color="#00F5D4"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B2FF7"/>
      <stop offset="1" stop-color="#00F5D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="258" rx="16" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>

  <!-- title -->
  <text x="450" y="125" font-size="100" font-weight="800" text-anchor="middle" letter-spacing="10" fill="url(#title)" filter="url(#glow)" opacity="0">KR4K3N
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <!-- name -->
  <text x="450" y="172" font-size="20" text-anchor="middle" letter-spacing="8" fill="#C9D1D9" opacity="0">ANANT AWASTHI
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.4s" fill="freeze"/>
  </text>

  <!-- tags -->
  <g font-size="13" text-anchor="middle" fill="#C9D1D9" letter-spacing="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.8s" fill="freeze"/>
    <rect x="141" y="200" width="190" height="32" rx="16" fill="#0D1117" stroke="#7B2FF7" stroke-width="1.5"/>
    <text x="236" y="221">OFFENSIVE SECURITY</text>
    <rect x="347" y="200" width="170" height="32" rx="16" fill="#0D1117" stroke="#F15BB5" stroke-width="1.5"/>
    <text x="432" y="221">WEB PENTESTING</text>
    <rect x="533" y="200" width="100" height="32" rx="16" fill="#0D1117" stroke="#00F5D4" stroke-width="1.5"/>
    <text x="583" y="221">CTFs</text>
    <rect x="649" y="200" width="110" height="32" rx="16" fill="#0D1117" stroke="#7B2FF7" stroke-width="1.5"/>
    <text x="704" y="221">RICING</text>
  </g>
</svg>
