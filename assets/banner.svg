<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'JetBrains Mono','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0a1f24"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B2FF7"/>
      <stop offset="0.5" stop-color="#F15BB5"/>
      <stop offset="1" stop-color="#00F5D4"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-0.5" to="0.5" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B2FF7"/>
      <stop offset="1" stop-color="#00F5D4"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7B2FF7" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="278" rx="16" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="278" rx="16" fill="url(#grid)"/>

  <!-- scanline -->
  <rect x="2" y="0" width="896" height="3" fill="#00F5D4" opacity="0.18">
    <animate attributeName="y" from="0" to="280" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <g fill="none" stroke="#00F5D4" stroke-width="2" stroke-linecap="round">
    <path d="M24 52V24H52"/>
    <path d="M848 24H876V52"/>
    <path d="M24 228V256H52"/>
    <path d="M876 228V256H848"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- glitch title -->
  <g font-size="104" font-weight="800" text-anchor="middle" letter-spacing="10">
    <text x="450" y="128" fill="#F15BB5" opacity="0.85">KR4K3N
      <animate attributeName="x" values="450;450;444;457;450;450" keyTimes="0;0.6;0.62;0.64;0.66;1" calcMode="discrete" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="128" fill="#00F5D4" opacity="0.85">KR4K3N
      <animate attributeName="x" values="450;450;456;445;450;450" keyTimes="0;0.6;0.62;0.64;0.66;1" calcMode="discrete" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="128" fill="url(#title)" filter="url(#glow)">KR4K3N
      <animate attributeName="y" values="128;128;126;130;128;128" keyTimes="0;0.6;0.62;0.64;0.66;1" calcMode="discrete" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- name -->
  <text x="450" y="176" font-size="22" text-anchor="middle" letter-spacing="9" fill="#C9D1D9" opacity="0">&gt; ANANT AWASTHI
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- tag pills -->
  <g font-size="13" text-anchor="middle" fill="#C9D1D9" letter-spacing="1">
    <rect x="141" y="204" width="190" height="32" rx="16" fill="#0D1117" stroke="#7B2FF7" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="236" y="225">OFFENSIVE SECURITY</text>

    <rect x="347" y="204" width="170" height="32" rx="16" fill="#0D1117" stroke="#F15BB5" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <text x="432" y="225">WEB PENTESTING</text>

    <rect x="533" y="204" width="100" height="32" rx="16" fill="#0D1117" stroke="#00F5D4" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="583" y="225">CTFs</text>

    <rect x="649" y="204" width="110" height="32" rx="16" fill="#0D1117" stroke="#7B2FF7" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="704" y="225">RICING</text>
  </g>
</svg>
