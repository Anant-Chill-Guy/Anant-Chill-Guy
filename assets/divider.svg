<svg width="900" height="24" viewBox="0 0 900 24" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7B2FF7" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#F15BB5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5D4" stop-opacity="1"/>
      <stop offset="1" stop-color="#00F5D4" stop-opacity="0"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="0" y="11" width="900" height="2" fill="url(#base)"/>
  <rect x="-200" y="10" width="200" height="4" rx="2" fill="url(#pulse)" filter="url(#g)">
    <animate attributeName="x" values="-200;900" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(450 12)">
    <rect x="-5" y="-5" width="10" height="10" fill="none" stroke="#00F5D4" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" values="45;405" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle r="2" fill="#F15BB5"><animate attributeName="r" values="1.5;3;1.5" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
